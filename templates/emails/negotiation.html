{% extends "emails/layout.html" %}
{% load humanize %}
{% block email_body %}
<h2 style="margin:0 0 12px;font-size:22px;color:#101827;">{{ heading }}</h2>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#3c4657;">{{ body }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border:1px solid #e3e7ee;border-radius:12px;margin:0 0 22px;font-size:14px;">
  <tr><td style="padding:10px 16px;border-bottom:1px dashed #e3e7ee;color:#5b6676;">Booking</td><td style="padding:10px 16px;text-align:right;font-weight:700;">#{{ booking.pk }} · {{ booking.category|default:"Service" }}</td></tr>
  <tr><td style="padding:10px 16px;border-bottom:1px dashed #e3e7ee;color:#5b6676;">Current price on the table</td><td style="padding:10px 16px;text-align:right;font-weight:700;color:#d97706;">{{ amount }}</td></tr>
  <tr><td style="padding:10px 16px;color:#5b6676;">Scheduled</td><td style="padding:10px 16px;text-align:right;">{{ booking.scheduled_for }}</td></tr>
</table>
<div style="text-align:center;">
  <a href="{{ cta_url }}" style="display:inline-block;background:#101827;color:#ffffff;font-weight:700;font-size:15px;padding:13px 28px;border-radius:12px;text-decoration:none;">Review the offer</a>
</div>
{% endblock %}
