{% extends "emails/layout.html" %}
{% block email_body %}
<h2 style="margin:0 0 12px;font-size:22px;color:#101827;">Welcome to LocalFix, {{ user.first_name|default:"friend" }}! 🎉</h2>
<p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#3c4657;">Your account is verified — you're all set.</p>
<p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#3c4657;">{{ blurb }}</p>
<div style="text-align:center;margin:0 0 8px;">
  <a href="{{ cta_url }}" style="display:inline-block;background:#f59e0b;color:#ffffff;font-weight:700;font-size:15px;padding:13px 28px;border-radius:12px;text-decoration:none;">{{ cta_label }}</a>
</div>
{% endblock %}
