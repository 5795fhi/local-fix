<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject|default:"LocalFix" }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#17202e;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f9;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(16,24,39,.08);">
          <tr>
            <td style="background:#101827;padding:22px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0"><tr>
                <td style="background:#f59e0b;border-radius:10px;width:36px;height:36px;text-align:center;font-weight:800;color:#201200;font-size:15px;line-height:36px;">LF</td>
                <td style="color:#ffffff;font-weight:700;font-size:18px;padding-left:10px;">LocalFix</td>
              </tr></table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block email_body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="background:#f8fafc;border-top:1px solid #e3e7ee;padding:18px 32px;font-size:12px;color:#5b6676;">
              You're receiving this because you have a LocalFix account.
              Visit <a href="{{ site_url }}" style="color:#d97706;">{{ site_url }}</a> ·
              <a href="{{ site_url }}/contact/" style="color:#d97706;">Contact us</a>
            </td>
          </tr>
        </table>
        <div style="color:#8a94a6;font-size:12px;margin-top:14px;">© {% now "Y" %} LocalFix · Demo project — all data is fictional.</div>
      </td>
    </tr>
  </table>
</body>
</html>
