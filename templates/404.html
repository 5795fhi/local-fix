{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="text-align:center">
    <div style="font-size:4.2rem;font-weight:800;font-family:var(--font-display);background:linear-gradient(135deg,var(--brand),var(--brand-strong));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;">404</div>
    <h1 style="margin-top:.4rem">This page took the day off</h1>
    <p class="text-muted">The page you're looking for doesn't exist, moved, or never did. Let's get you back to something useful.</p>
    <div class="flex gap-sm mt-2" style="justify-content:center;flex-wrap:wrap">
      <a href="{% url 'core:home' %}" class="btn btn-primary">Go home</a>
      <a href="{% url 'services:provider_directory' %}" class="btn btn-ghost">Find a pro</a>
      <a href="{% url 'core:contact' %}" class="btn btn-ghost">Contact us</a>
    </div>
  </div>
</div>
{% endblock %}
