{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="text-align:center">
    <div style="font-size:4.2rem;font-weight:800;font-family:var(--font-display);background:linear-gradient(135deg,var(--danger),#8f2233);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;">500</div>
    <h1 style="margin-top:.4rem">Something broke on our side</h1>
    <p class="text-muted">An unexpected error occurred. It's been noted — please try again in a moment.</p>
    <div class="flex gap-sm mt-2" style="justify-content:center;flex-wrap:wrap">
      <a href="{% url 'core:home' %}" class="btn btn-primary">Go home</a>
      <a href="{% url 'core:contact' %}" class="btn btn-ghost">Report the issue</a>
    </div>
  </div>
</div>
{% endblock %}
